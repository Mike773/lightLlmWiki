[project]
name = "light-llm-wiki"
version = "0.1.0"
description = "Knowledge base for analyst agent (direction-isolated, PostgreSQL + pgvector)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "psycopg[binary]>=3",
    "pgvector>=0.3",
    "openai>=1.40",
]

[project.scripts]
light-llm-wiki-pipeline = "light_llm_wiki.document_processor.cli:main"
light-llm-wiki-query = "light_llm_wiki.query.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/light_llm_wiki"]
